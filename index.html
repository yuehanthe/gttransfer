<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="description" content="search for classes that transfer to georgia tech!">
        <title>gt transfer reverse search</title>
        <!-- <link rel="icon" type="image/png" href="icon.png"> -->
         <style>
            * {
                background-color: #222;
                color: #ddd;
                font-family: arial, sans-serif;
            }

            h1 {
                text-align: center;
            }

            h2 {
                text-align: center;
            }

            input {
                border: none;
                border-radius: 3px;
                background-color: #444;
            }

            select {
                border: none;
                border-radius: 3px;
                background-color: #444;
            }

            button {
                border: none;
                border-radius: 3px;
                background-color: #444;
            }

            button:hover {
                background-color: #777;
            }

            table {
                border-collapse: collapse;
                min-width: 320px;
                max-width: 800px;
                width: 100%;
                margin: 0 auto;
            }

            th {
                text-align: left;
                border-bottom: 1px solid #ddd; 
            }

            tr:hover td {
                background-color: #555;
            }

            .container {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                justify-content: center; 
                margin-bottom: 1rem;
            }
         </style>
    </head>
    <body>
        <h1>georgia tech transfer reverse search</h1>
        <h2>search transfer/transient classes!</h2>
        <div class = "container">
            <span>subject: <input id = "subj"></span>
            <span>course code: <input id = "num"></span>
            <span>state: 
                <select id="state">
                    <option value = "" selected></option>
                    <option value="AL">alabama</option>
                    <option value="AK">alaska</option>
                    <option value="AZ">arizona</option>
                    <option value="AR">arkansas</option>
                    <option value="CA">california</option>
                    <option value="CO">colorado</option>
                    <option value="CT">connecticut</option>
                    <option value="DC">district of colmbia</option>
                    <option value="DE">delaware</option>
                    <option value="GA">georgia</option>
                    <option value="HI">hawaii</option>
                    <option value="ID">idaho</option>
                    <option value="IL">illinois</option>
                    <option value="IN">indiana</option>
                    <option value="IA-scale">iowa</option>
                    <option value="KS">kansas</option>
                    <option value="KY">kentucky</option>
                    <option value="LA">louisiana</option>
                    <option value="ME">maine</option>
                    <option value="MD">maryland</option>
                    <option value="MA">massachusetts</option>
                    <option value="MI">michigan</option>
                    <option value="MN">minnesota</option>
                    <option value="MS">mississippi</option>
                    <option value="MO">missouri</option>
                    <option value="MT">montana</option>
                    <option value="NE">nebraska</option>
                    <option value="NV">nevada</option>
                    <option value="NH">new hampshire</option>
                    <option value="NJ">new jersey</option>
                    <option value="NM">new mexico</option>
                    <option value="NY">new york</option>
                    <option value="NC">north carolina</option>
                    <option value="ND">north dakota</option>
                    <option value="OH">ohio</option>
                    <option value="OK">oklahoma</option>
                    <option value="OR">oregon</option>
                    <option value="PA">pennsylvania</option>
                    <option value="RI">rhode island</option>
                    <option value="SC">south carolina</option>
                    <option value="SD">south dakota</option>
                    <option value="TN">tennessee</option>
                    <option value="TX">texas</option>
                    <option value="UT">utah</option>
                    <option value="VT">vermont</option>
                    <option value="VA">virginia</option>
                    <option value="WA">washington</option>
                    <option value="WV">west virginia</option>
                    <option value="WI">wisconsin</option>
                    <option value="WY">wyoming</option>
                </select>
            </span>
            <button id = "search">search</button>
        </div>
        <div class = "container">
            <table style = "display: none" id = "table">
                <thead>
                    <tr>
                        <th style="width: 100%;">school</th>
                        <th>subject&nbsp</th>
                        <th>code</th>
                    </tr>
                </thead>
                <tbody id="results"></tbody>
            </table>
        </div>
        <script src="data.js"></script>
        <script>
            document.getElementById("search").onclick = () => {
                var subj = document.getElementById("subj").value.toUpperCase();
                var num = document.getElementById("num").value;
                var state = document.getElementById("state").value;

                var table = document.getElementById("results");
                table.innerHTML = "";

                for (var school of data.schools) {
                    if (state.length != 0) if (school.state !== state) continue;
                    for (var course of school.courses) {
                        if ((course.gt_subj === subj || subj.length == 0) && (course.gt_num === num || num.length == 0) && (school.name !== course.ext_num)) {
                            var row = table.insertRow();
                            row.insertCell().textContent = school.name;
                            row.insertCell().textContent = course.ext_subj;
                            row.insertCell().textContent = course.ext_num;
                        }
                    }
                }
                document.getElementById("table").style.display = "inline";
            };
        </script>
    </body>
</html>
